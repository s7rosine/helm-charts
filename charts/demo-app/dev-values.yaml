# dev overrides only (anything not listed keeps the base value)
replicaCount: 2

image:
  repository: nginxinc/nginx-unprivileged
  tag: "stable"
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 8080

# small resource requests so it runs anywhere
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

ingress:
  enabled: true            # turn ON for dev
  className: "nginx"       # ingress-nginx in Minikube
  hosts:
    - host: demo.localtest.me
      paths:
        - path: /
          pathType: Prefix
  tls: []                  # no TLS for dev/minikube
